[project]
name = "wke-ml"
version = "0.1.0"
description = "Wikipedia Knowledge Explorer - ML inference service (embeddings, clustering, summarization)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "prometheus-client==0.26.0",
    "torch==2.15.0",
    "transformers==5.22.2",
    "sentence-transformers==6.2.0",
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "safetensors==0.8.0",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "ruff==0.17.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wke_ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not model'"
markers = [
    "model: real-model smoke test against actual weights; deselected by default",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
