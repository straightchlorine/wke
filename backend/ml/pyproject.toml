[project]
name = "wke-ml"
version = "0.1.0"
description = "Wikipedia Knowledge Explorer - ML inference service (embeddings, clustering, summarization)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.43.0",
    "pydantic-settings==2.14.1",
    "prometheus-client==0.23.1",
    "torch==2.11.0",
    "transformers==5.10.1",
    "sentence-transformers==5.3.0",
    "scikit-learn==1.8.0",
    "numpy",
    "safetensors",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.16.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wke_ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not model'"
markers = [
    "model: real-model smoke test against actual weights; deselected by default",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
