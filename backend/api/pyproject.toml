[project]
name = "wke-api"
version = "0.1.0"
description = "Wikipedia Knowledge Explorer API: REST, MCP, job worker, watcher and trending entrypoints."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]>=0.54,<1",
    "pydantic[email]>=2.14.2,<3",
    "pydantic-settings==2.16.2",
    "httpx>=0.28.1,<1",
    "redis[hiredis]>=8.1,<9",
    "slowapi>=0.1.10,<1",
    "prometheus-client>=0.26,<1",
    "selectolax>=1.0.2,<2",
    "mcp>=2.3,<3",
    "pyyaml>=6.0.3,<7",
    "structlog>=26.1,<27",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov>=7.1,<8",
    "fakeredis[lua]>=2.40,<3",
    "hypothesis>=6.170,<7",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wke"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["wke"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["wke", "tests"]
