# Built files under /assets/ have a content hash in their name, so browsers may keep them.
# revalidating index.html, so a new deploy reaches users right away.
map $uri $wke_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/fonts/ "public, max-age=604800";
    ~^/(favicon\.(ico|svg)|favicon-(16x16|32x32)\.png|apple-touch-icon\.png|android-chrome-.*\.png|og\.png)$ "public, max-age=86400";
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # This serves the built app.
    # In deployed scenario, reverse proxy in front of it sends the API paths to the
    # API service (wke-api) and sets the Content-Security-Policy, so those aren't set here.

    # every header is set here and no location below adds one
    add_header Cache-Control $wke_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # An unknown path answers 404 with the app as the body; the app shows its own
    # not-found page while crawlers still see a real 404.
    error_page 404 /index.html;

    location ~ /\. {
        deny all;
    }

    # The app's own pages get index.html with status 200; all /t/ queries as well,
    # since only api has information whether this topic exists or not.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(machines|t)(/.*)?$ {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
