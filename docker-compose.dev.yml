services:
  api:
    extends:
      file: docker-compose.yml
      service: api
    image: !reset null

  watcher:
    extends:
      file: docker-compose.yml
      service: watcher
    image: !reset null

  ml:
    extends:
      file: docker-compose.yml
      service: ml
    image: !reset null

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  web:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile.dev
    environment:
      WKE_API_ORIGIN: http://api:8000
    ports:
      - "8080:5173"
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  app-network:
    driver: bridge
