name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A stale uv.lock fails the run instead of being rewritten by uv run.
env:
  UV_LOCKED: "1"

jobs:
  backend:
    name: backend (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            pytest: --cov=wke --cov-fail-under=85
          - component: ml
            pytest: ""
    defaults:
      run:
        working-directory: backend/${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          cache-dependency-glob: backend/${{ matrix.component }}/uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The frontend's Python scripts use the api's ruff configuration.
      - name: Lint the frontend Python
        if: matrix.component == 'api'
        run: |
          uv run ruff check ../../frontend/app/scripts ../../frontend/app/e2e/fixtures
          uv run ruff format --check ../../frontend/app/scripts ../../frontend/app/e2e/fixtures

      # The ml suite deselects the real-weights test (pytest addopts); the release workflow's model smoke test loads the real weights.
      - name: Run tests
        run: uv run pytest ${{ matrix.pytest }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: frontend/app/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds first; the e2e run below serves the build it leaves in dist.
      - name: Verify
        run: pnpm run verify

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm exec playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-traces
          path: frontend/app/test-results
          if-no-files-found: ignore
          retention-days: 7

  repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # config only renders; the env_file just has to exist.
      - name: Compose config
        run: |
          cp backend/api/.env.example backend/api/.env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.dev.yml config -q

      # An if statement, because bash -e ignores a failing "! cmd".
      - name: ASCII only
        run: |
          if git grep -nIP '[^\x00-\x7F]' -- . ':!frontend/app/src/api/generated'; then
            echo "::error::non-ASCII characters found"
            exit 1
          fi

      - name: Shellcheck
        run: shellcheck scripts/ci/*.sh

      # Fails when the manifests Argo CD syncs do not render.
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/base > /dev/null
