apiVersion: batch/v1
kind: CronJob
metadata:
  name: wke-trending
  labels:
    app.kubernetes.io/name: wke-trending
    app.kubernetes.io/component: trending
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wke-trending
            app.kubernetes.io/component: trending
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trending
              image: ghcr.io/straightchlorine/wke-api:0.1.0
              command: ["python", "-m", "wke.trending"]
              envFrom:
                - configMapRef:
                    name: wke-config
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
