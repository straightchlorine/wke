apiVersion: apps/v1
kind: Deployment
metadata:
  name: wke-watcher
  labels:
    app.kubernetes.io/name: wke-watcher
    app.kubernetes.io/component: watcher
spec:
  replicas: 1
  # Single EventStreams connection with a resumption position; two pods
  # would race the same stream.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wke-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wke-watcher
        app.kubernetes.io/component: watcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          image: ghcr.io/straightchlorine/wke-api:0.1.0
          command: ["python", "-m", "wke.watcher"]
          envFrom:
            - configMapRef:
                name: wke-config
          env:
            - name: WATCHER_METRICS_PORT
              value: "8000"
          ports:
            - name: metrics
              containerPort: 8000
          # /tmp/heartbeat mtime, written every 10 s (wke/watcher/stream.py).
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 30
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
