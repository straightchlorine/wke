services:
  api:
    build: ./backend/api
    image: ghcr.io/straightchlorine/wke-api:latest
    env_file: ./backend/api/.env
    environment:
      ML_URL: http://ml:8000
      REDIS_URL: redis://redis:6379/0
      WKE_PORT: "8000"
      PUBLIC_HOST: localhost:8080
      PUBLIC_SCHEME: http
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 512m

  watcher:
    build: ./backend/api
    image: ghcr.io/straightchlorine/wke-api:latest
    command: ["python", "-m", "wke.watcher"]
    env_file: ./backend/api/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 128m
    # stream loop touches /tmp/heartbeat every 10 s
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 30"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  ml:
    build: ./backend/ml
    image: ghcr.io/straightchlorine/wke-ml:latest
    ports:
      - "8001:8000"
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 3g
    profiles: ["ml"]

  redis:
    # also the multi-arch digest
    image: redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./frontend/app
    image: ghcr.io/straightchlorine/wke-web:latest
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 128m

  edge:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine-slim@sha256:a8cb0f33d51fa107c96fd2bd3a71aaf564ec131e9d2bdf8700944f0ed8b170d7
    configs:
      - source: edge
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge

configs:
  edge:
    content: |
      server {
          listen 8080;
          # Keep the browser's Host: PUBLIC_HOST and the MCP allowed hosts expect it.
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          location ~ ^/(api|mcp)(/|$$) { proxy_pass http://api:8000; }
          location = /openapi.json { proxy_pass http://api:8000; }
          location = /llms.txt { proxy_pass http://api:8000; }
          location = /sitemap.xml { proxy_pass http://api:8000; }
          location / { proxy_pass http://web:8080; }
      }
